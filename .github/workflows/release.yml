name: release

# Builds the static kaal-<os>-<arch> binaries for every platform and
# attaches them to the GitHub Release on a v* tag push. The asset naming
# matches internal/cli releaseAssetName(), which `kaal update`'s
# release-fetch path looks up. The version is stamped from the tag so the
# fetched binary reports a version newer than the installed one.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: kaal-${{ matrix.goos }}-${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x" # the P0 floor; see docs/go-migration-plan.md §9.1
      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w -X github.com/kaal/kaal/internal/cli.version=${GITHUB_REF_NAME#v}" -o "kaal-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}" ./cmd/kaal
      - name: Version probe
        shell: bash
        run: |
          BIN="./kaal-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}"
          test "$("$BIN" --version)" = "kaal ${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: kaal-${{ matrix.goos }}-${{ matrix.goarch }}
          path: kaal-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
