name: go-build

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x" # the P0 floor; see docs/go-migration-plan.md §9.1
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Static build
        env:
          CGO_ENABLED: "0" # one static binary, no cgo
        run: go build -trimpath -ldflags "-s -w" -o kaal ./cmd/kaal
      - name: Version probe
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=./kaal.exe; else BIN=./kaal; fi
          test "$("$BIN" --version)" = "kaal 0.3"
